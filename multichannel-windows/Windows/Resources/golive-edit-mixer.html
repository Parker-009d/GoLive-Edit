<script>
(function(){
  const tool=document.querySelector('.resize-tool'),toggle=document.getElementById('resize-toggle'),menu=document.getElementById('resize-menu');
  const placeResizeTool=()=>{const nav=document.querySelector('#root nav[aria-label="Pages"]'),fx=nav&&nav.querySelector('button:last-child');if(!tool||!toggle||!fx)return;const r=fx.getBoundingClientRect(),css=getComputedStyle(fx),fxCssHeight=parseFloat(css.height)||r.height,border=(parseFloat(css.borderTopWidth)||0)+(parseFloat(css.borderBottomWidth)||0),scale=r.height/(fxCssHeight+border||r.height);toggle.style.boxSizing='border-box';toggle.style.height=r.height+'px';toggle.style.minHeight=r.height+'px';toggle.style.fontSize=(parseFloat(css.fontSize)*scale)+'px';toggle.style.letterSpacing=(parseFloat(css.letterSpacing)||0)*scale+'px';toggle.style.gap=(parseFloat(css.gap)||0)*scale+'px';toggle.style.padding=`${parseFloat(css.paddingTop)*scale}px ${parseFloat(css.paddingRight)*scale}px ${parseFloat(css.paddingBottom)*scale}px ${parseFloat(css.paddingLeft)*scale}px`;toggle.style.borderWidth=`${(parseFloat(css.borderTopWidth)||0)*scale}px ${(parseFloat(css.borderRightWidth)||0)*scale}px ${(parseFloat(css.borderBottomWidth)||0)*scale}px ${(parseFloat(css.borderLeftWidth)||0)*scale}px`;const sourceIcon=fx.querySelector('svg'),icon=toggle.querySelector('svg');if(sourceIcon&&icon){const ir=sourceIcon.getBoundingClientRect();icon.style.width=ir.width+'px';icon.style.height=ir.height+'px'}tool.style.top=r.top+'px';tool.style.left=Math.max(8,Math.min(innerWidth-tool.offsetWidth-8,r.right+8))+'px';tool.style.visibility='visible'};

  window.addEventListener('resize',queuePlace);const root=document.getElementById('root');if(root)new MutationObserver(queuePlace).observe(root,{childList:true,subtree:true});
  queuePlace();
  window.__goLiveSetScale=function(preset){

    const scales={standard:.72,medium:.84,high:.94,ultra:1};let zoom=scales[preset];

  if(toggle)toggle.addEventListener('click',window.__goLiveToggleResize);
