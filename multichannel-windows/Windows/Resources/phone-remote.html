<!doctype html>
<html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114">
<title>GoLive Phone Remote</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f3f4f6;font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:24px;max-width:560px;margin:auto}h1{font-size:22px;margin:0 0 18px}section{background:#1b1d22;border:1px solid #454950;border-radius:12px;padding:18px;margin:14px 0}.muted{color:#aeb3bb;font-size:14px}input,button{font:inherit;border-radius:8px;padding:12px;border:1px solid #69717b}input{background:#0f1012;color:white;width:100%;margin:10px 0}button{background:#d8dce1;color:#121316;font-weight:650;width:100%;margin:7px 0}.ch{border-top:1px solid #454950;padding-top:12px;margin-top:14px}.ch label{display:flex;justify-content:space-between;font-weight:650}.ch input{accent-color:#2788ff;padding:0}.actions{display:flex;gap:8px}.actions button{flex:1}.status{min-height:20px;color:#9dc8ff}.active{background:#2788ff!important;color:#fff!important}.offline{opacity:.55}
</style>
<body><h1>GoLive Â· Phone Remote</h1>
<section id="pair"><div class="muted">Enter the 8-character pairing password shown in the Mac mixer.</div><input id="code" maxlength="8" autocomplete="one-time-code" autocapitalize="characters" placeholder="PAIRING PASSWORD"><button id="pairBtn">Pair phone</button><div class="status" id="pairStatus"></div></section>
<section id="controls" hidden><div class="actions"><span class="muted" id="connectionStatus">Connected to the mixer</span><button id="connectionToggle">Disconnect</button></div>
<div class="ch"><label>CH 1 <span id="v1">0.0 dB</span></label><input id="f1" type="range" min="-60" max="6" step="0.5" value="0"><div class="actions"><button data-mute="1">Mute</button><button data-solo="1">Solo</button></div></div>
<div class="ch"><label>CH 2 <span id="v2">0.0 dB</span></label><input id="f2" type="range" min="-60" max="6" step="0.5" value="0"><div class="actions"><button data-mute="2">Mute</button><button data-solo="2">Solo</button></div></div>
<div class="ch"><label>Main LR <span id="vm">0.0 dB</span></label><input id="fm" type="range" min="-60" max="6" step="0.5" value="0"><button id="mainMute">Mute Main</button></div>
<div class="status" id="controlStatus"></div></section>
<script>
let token=localStorage.getItem('golive-token')||'',connected=!!token;const pair=document.querySelector('#pair'),controls=document.querySelector('#controls'),toggle=document.querySelector('#connectionToggle');
function setConnected(value){connected=value;toggle.textContent=connected?'Disconnect':'Connect';document.querySelector('#connectionStatus').textContent=connected?'Connected to the mixer':'Disconnected';controls.classList.toggle('offline',!connected);controls.querySelectorAll('input,button:not(#connectionToggle)').forEach(e=>e.disabled=!connected);if(connected)refreshState()}
async function pairPhone(){const out=document.querySelector('#pairStatus');out.textContent='Pairingâ€¦';try{const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.querySelector('#code').value.trim().toUpperCase()})});const j=await r.json();if(!r.ok)throw Error(j.error||'Pairing failed');token=j.token;localStorage.setItem('golive-token',token);pair.hidden=true;controls.hidden=false;out.textContent='';setConnected(true)}catch(e){out.textContent=e.message}}
async function send(data){if(!connected)return;const out=document.querySelector('#controlStatus');try{const r=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Connection lost');out.textContent=''}catch(e){out.textContent=e.message;if(e.message.includes('Pair')){localStorage.removeItem('golive-token');token='';pair.hidden=false;controls.hidden=true}}}
async function refreshState(){if(!token||!connected)return;try{const r=await fetch('/api/state',{headers:{'Authorization':'Bearer '+token}}),s=await r.json();if(!r.ok)throw Error(s.error||'Connection lost');const focus=document.activeElement;[['f1','v1',s.ch[0].db],['f2','v2',s.ch[1].db],['fm','vm',s.main.db]].forEach(([id,lbl,val])=>{const el=document.getElementById(id);if(focus!==el)el.value=val;document.getElementById(lbl).textContent=(+val).toFixed(1)+' dB'});[[document.querySelector('[data-mute="1"]'),s.ch[0].mute,'Mute','Muted'],[document.querySelector('[data-mute="2"]'),s.ch[1].mute,'Mute','Muted'],[document.querySelector('[data-solo="1"]'),s.ch[0].solo,'Solo','Solo On'],[document.querySelector('[data-solo="2"]'),s.ch[1].solo,'Solo','Solo On'],[document.querySelector('#mainMute'),s.main.mute,'Mute Main','Main Muted']].forEach(([button,on,offLabel,onLabel])=>{button.classList.toggle('active',!!on);button.textContent=on?onLabel:offLabel})}catch(e){document.querySelector('#controlStatus').textContent=e.message;if(e.message.includes('Pair')){localStorage.removeItem('golive-token');token='';pair.hidden=false;controls.hidden=true}}}
document.querySelector('#pairBtn').onclick=pairPhone;document.querySelector('#code').onkeydown=e=>{if(e.key==='Enter')pairPhone()};toggle.onclick=()=>setConnected(!connected);
[['f1','v1',1],['f2','v2',2],['fm','vm',0]].forEach(([id,label,ch])=>{const el=document.getElementById(id),v=document.getElementById(label);el.oninput=()=>{v.textContent=(+el.value).toFixed(1)+' dB';send({type:'fader',channel:ch,value:+el.value})}});
document.querySelectorAll('[data-mute]').forEach(b=>b.onclick=()=>send({type:'mute',channel:+b.dataset.mute}));document.querySelectorAll('[data-solo]').forEach(b=>b.onclick=()=>send({type:'solo',channel:+b.dataset.solo}));document.querySelector('#mainMute').onclick=()=>send({type:'mainMute'});
const codeFromQR=new URLSearchParams(location.search).get('code');if(codeFromQR)document.querySelector('#code').value=codeFromQR;
if(token){pair.hidden=true;controls.hidden=false;setConnected(true)}
setInterval(()=>{if(token&&connected)refreshState()},250);
</script></body></html>
